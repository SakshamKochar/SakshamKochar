<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 104" width="840" height="104" fill="#e6edf3" role="img" aria-label="Highlights: 3rd place at ASU Reverse the Future with a $3,000 prize, 9 million Reddit posts analyzed, 3.86 GPA, two internships">
<title>Highlights: 3rd place at ASU Reverse the Future with a $3,000 prize, 9 million Reddit posts analyzed, 3.86 GPA, two internships</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.cap{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:11px;letter-spacing:.3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.tile{animation:tile 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes tile{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
.glow{transform-box:fill-box;transform-origin:left center;animation:glow 6s ease-in-out infinite}
@keyframes glow{0%{transform:scaleX(0);opacity:.9}45%{transform:scaleX(1);opacity:.9}80%,100%{transform:scaleX(1);opacity:0}}
</style>
<g class="tile" style="animation-delay:0.00s">
<rect x="0.5" y=".5" width="200" height="103" rx="12" fill="#07090d" stroke="#1b2430"/>
<text x="18" y="46" font-size="32" font-weight="800" letter-spacing="-1" fill="#ffb454">3rd</text>
<text class="cap" x="18" y="68" font-size="10.5" fill="#e6edf3">Reverse the Future, ASU</text>
<text class="cap" fill="#7d8796" x="18" y="84" font-size="10.5">$3,000 prize, ReCompute</text>
<rect class="glow" x="18" y="96" width="165" height="2" rx="1" fill="#ffb454" style="animation-delay:0.0s"/>
</g>
<g class="tile" style="animation-delay:0.18s">
<rect x="213.5" y=".5" width="200" height="103" rx="12" fill="#07090d" stroke="#1b2430"/>
<text x="231" y="46" font-size="32" font-weight="800" letter-spacing="-1" fill="#00e1ff">9M</text>
<text class="cap" x="231" y="68" font-size="10.5" fill="#e6edf3">Reddit posts analyzed</text>
<text class="cap" fill="#7d8796" x="231" y="84" font-size="10.5">sole-author study</text>
<rect class="glow" x="231" y="96" width="165" height="2" rx="1" fill="#00e1ff" style="animation-delay:0.5s"/>
</g>
<g class="tile" style="animation-delay:0.36s">
<rect x="426.5" y=".5" width="200" height="103" rx="12" fill="#07090d" stroke="#1b2430"/>
<text x="444" y="46" font-size="32" font-weight="800" letter-spacing="-1" fill="#3ddc97">3.86</text>
<text class="cap" x="444" y="68" font-size="10.5" fill="#e6edf3">GPA at Arizona State</text>
<text class="cap" fill="#7d8796" x="444" y="84" font-size="10.5">Dean's List, every term</text>
<rect class="glow" x="444" y="96" width="165" height="2" rx="1" fill="#3ddc97" style="animation-delay:1.0s"/>
</g>
<g class="tile" style="animation-delay:0.54s">
<rect x="639.5" y=".5" width="200" height="103" rx="12" fill="#07090d" stroke="#1b2430"/>
<text x="657" y="46" font-size="32" font-weight="800" letter-spacing="-1" fill="#8b7bff">2</text>
<text class="cap" x="657" y="68" font-size="10.5" fill="#e6edf3">internships so far:</text>
<text class="cap" fill="#7d8796" x="657" y="84" font-size="10.5">Blink Charging, Saxo Bank</text>
<rect class="glow" x="657" y="96" width="165" height="2" rx="1" fill="#8b7bff" style="animation-delay:1.5s"/>
</g>
</svg>
