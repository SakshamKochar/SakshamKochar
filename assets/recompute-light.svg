<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 132" width="420" height="132" role="img" aria-label="Seven possible routes for a retired GPU server, scored as bars">
<title>Seven possible routes for a retired GPU server, scored as bars</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#0d1117}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.cap{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:11px;fill:#57606a;letter-spacing:.3px}
.dim{fill:#57606a}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.bar{transform-box:fill-box;transform-origin:left center;animation:bar 10s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes bar{0%{transform:scaleX(0)}14%{transform:scaleX(1)}90%{transform:scaleX(1);opacity:1}97%,100%{transform:scaleX(1);opacity:0}}
.tag{animation:tag 10s ease infinite}
@keyframes tag{0%,18%{opacity:0}24%{opacity:1}90%{opacity:1}97%,100%{opacity:0}}
</style>
<rect x=".5" y=".5" width="419" height="131" rx="14" fill="#ffffff" stroke="#d5dbe3"/>
<text class="cap" x="18" y="24">fig. 3 · seven routes scored, one best call</text>
<text class="m" x="128" y="45" font-size="10" text-anchor="end" fill="#57606a">sell now</text>
<rect class="bar" x="138" y="37" width="130.2" height="9" rx="2.5" fill="#b6bfca" style="animation-delay:0.00s"/>
<text class="m" x="128" y="58" font-size="10" text-anchor="end" fill="#57606a">list and wait</text>
<rect class="bar" x="138" y="50" width="147" height="9" rx="2.5" fill="#b6bfca" style="animation-delay:0.12s"/>
<text class="m" x="128" y="71" font-size="10" text-anchor="end" fill="#57606a">rent while listed</text>
<rect class="bar" x="138" y="63" width="163.8" height="9" rx="2.5" fill="#b6bfca" style="animation-delay:0.24s"/>
<text class="m" x="128" y="84" font-size="10" text-anchor="end" fill="#0d1117">host longer</text>
<rect class="bar" x="138" y="76" width="195.3" height="9" rx="2.5" fill="#0a7ea4" style="animation-delay:0.36s"/>
<text class="m tag" x="341.3" y="84" font-size="10" fill="#0a7ea4">best route</text>
<text class="m" x="128" y="97" font-size="10" text-anchor="end" fill="#57606a">repair</text>
<rect class="bar" x="138" y="89" width="115.5" height="9" rx="2.5" fill="#b6bfca" style="animation-delay:0.48s"/>
<text class="m" x="128" y="110" font-size="10" text-anchor="end" fill="#57606a">harvest parts</text>
<rect class="bar" x="138" y="102" width="84" height="9" rx="2.5" fill="#b6bfca" style="animation-delay:0.60s"/>
<text class="m" x="128" y="123" font-size="10" text-anchor="end" fill="#57606a">recycle</text>
<rect class="bar" x="138" y="115" width="33.6" height="9" rx="2.5" fill="#b6bfca" style="animation-delay:0.72s"/>
</svg>
