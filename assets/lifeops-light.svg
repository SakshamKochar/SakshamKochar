<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 132" width="420" height="132" role="img" aria-label="A day timeline where focus blocks are scheduled around fixed meetings">
<title>A day timeline where focus blocks are scheduled around fixed meetings</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#0d1117}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.cap{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:11px;fill:#57606a;letter-spacing:.3px}
.dim{fill:#57606a}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.blk{transform-box:fill-box;transform-origin:center top;animation:blk 10s cubic-bezier(.2,.9,.3,1.2) infinite both}
@keyframes blk{0%{opacity:0;transform:translateY(-22px) scaleY(.6)}7%{opacity:.9;transform:none}84%{opacity:.9;transform:none}90%,100%{opacity:0;transform:none}}
</style>
<rect x=".5" y=".5" width="419" height="131" rx="14" fill="#ffffff" stroke="#d5dbe3"/>
<text class="cap" x="18" y="24">fig. 4 · focus blocks packed around meetings (striped)</text>
<line x1="22" y1="52" x2="22" y2="95" stroke="#e7ebf0"/>
<text class="cap" x="22" y="110" font-size="10" text-anchor="middle">8a</text>
<line x1="53.3" y1="52" x2="53.3" y2="95" stroke="#e7ebf0"/>
<line x1="84.7" y1="52" x2="84.7" y2="95" stroke="#e7ebf0"/>
<text class="cap" x="84.7" y="110" font-size="10" text-anchor="middle">10a</text>
<line x1="116" y1="52" x2="116" y2="95" stroke="#e7ebf0"/>
<line x1="147.3" y1="52" x2="147.3" y2="95" stroke="#e7ebf0"/>
<text class="cap" x="147.3" y="110" font-size="10" text-anchor="middle">12p</text>
<line x1="178.7" y1="52" x2="178.7" y2="95" stroke="#e7ebf0"/>
<line x1="210" y1="52" x2="210" y2="95" stroke="#e7ebf0"/>
<text class="cap" x="210" y="110" font-size="10" text-anchor="middle">2p</text>
<line x1="241.3" y1="52" x2="241.3" y2="95" stroke="#e7ebf0"/>
<line x1="272.7" y1="52" x2="272.7" y2="95" stroke="#e7ebf0"/>
<text class="cap" x="272.7" y="110" font-size="10" text-anchor="middle">4p</text>
<line x1="304" y1="52" x2="304" y2="95" stroke="#e7ebf0"/>
<line x1="335.3" y1="52" x2="335.3" y2="95" stroke="#e7ebf0"/>
<text class="cap" x="335.3" y="110" font-size="10" text-anchor="middle">6p</text>
<line x1="366.7" y1="52" x2="366.7" y2="95" stroke="#e7ebf0"/>
<line x1="398" y1="52" x2="398" y2="95" stroke="#e7ebf0"/>
<text class="cap" x="398" y="110" font-size="10" text-anchor="middle">8p</text>
<pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="#b6bfca"/></pattern>
<rect x="84.7" y="56" width="31.3" height="32" rx="4" fill="url(#h)" opacity=".7"/>
<rect x="178.7" y="56" width="47" height="32" rx="4" fill="url(#h)" opacity=".7"/>
<rect x="304" y="56" width="15.7" height="32" rx="4" fill="url(#h)" opacity=".7"/>
<rect class="blk" x="24" y="56" width="58.7" height="32" rx="4" fill="#0a7ea4" opacity=".9" style="animation-delay:0.50s"/>
<rect class="blk" x="118" y="56" width="58.7" height="32" rx="4" fill="#6b4bd8" opacity=".9" style="animation-delay:1.05s"/>
<rect class="blk" x="227.7" y="56" width="74.3" height="32" rx="4" fill="#1a7f4b" opacity=".9" style="animation-delay:1.60s"/>
<rect class="blk" x="321.7" y="56" width="43" height="32" rx="4" fill="#b76e00" opacity=".9" style="animation-delay:2.15s"/>
</svg>
